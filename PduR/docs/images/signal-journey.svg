<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="title description">
  <title id="title">A signal travels from ECU 1 through CAN to ECU 2</title>
  <desc id="description">VehicleSpeed 1234 travels down ECU 1 through Application, COM, PduR and CanIf. A simulated CAN bus carries identifier 0x123 and bytes D2 04 to ECU 2, where it travels up CanIf, PduR and COM to the receiving application.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c4f879"/></marker>
    <style>text{font-family:Arial,Helvetica,sans-serif;fill:#edf3ec}.small{font-size:13px;fill:#b4c3b8}.label{font-size:12px;fill:#c4f879;letter-spacing:1px}.module{fill:#142019;stroke:#52654f}.name{font-size:19px;font-weight:bold}.flow{fill:none;stroke:#c4f879;stroke-width:2.5;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1040" height="620" rx="16" fill="#101715"/>
  <text x="40" y="43" class="label">EDUSAR / COMMUNICATION STACK</text>
  <text x="40" y="82" font-size="29" font-weight="bold">One signal. Every layer.</text>
  <text x="40" y="108" class="small">The C demo transfers a buffered frame between two sequential ECU lifecycles.</text>
  <rect x="40" y="140" width="370" height="397" rx="12" fill="#1b271f" stroke="#52654f"/>
  <rect x="630" y="140" width="370" height="397" rx="12" fill="#1b271f" stroke="#52654f"/>
  <text x="65" y="175" class="name">ECU 1</text><text x="321" y="175" class="label">SEND ↓</text>
  <text x="655" y="175" class="name">ECU 2</text><text x="903" y="175" class="label">READ ↑</text>
  <g>
    <rect class="module" x="65" y="195" width="320" height="58" rx="6"/><text x="82" y="220" class="name">Application</text><text x="82" y="241" class="small">VehicleSpeed = 1234</text>
    <rect class="module" x="65" y="278" width="320" height="58" rx="6"/><text x="82" y="303" class="name">COM</text><text x="82" y="324" class="small">Pack 0x04D2 → D2 04 · TX PDU 10</text>
    <rect class="module" x="65" y="361" width="320" height="58" rx="6"/><text x="82" y="386" class="name">PduR</text><text x="82" y="407" class="small">Route COM PDU 10 → CanIf PDU 20</text>
    <rect class="module" x="65" y="444" width="320" height="58" rx="6"/><text x="82" y="469" class="name">CanIf</text><text x="82" y="490" class="small">Resolve CAN identifier → driver hook</text>
    <rect class="module" x="655" y="195" width="320" height="58" rx="6"/><text x="672" y="220" class="name">Application</text><text x="672" y="241" class="small">VehicleSpeed = 1234 ✓</text>
    <rect class="module" x="655" y="278" width="320" height="58" rx="6"/><text x="672" y="303" class="name">COM</text><text x="672" y="324" class="small">Unpack D2 04 → 1234 · RX PDU 11</text>
    <rect class="module" x="655" y="361" width="320" height="58" rx="6"/><text x="672" y="386" class="name">PduR</text><text x="672" y="407" class="small">Route CanIf PDU 21 → COM PDU 11</text>
    <rect class="module" x="655" y="444" width="320" height="58" rx="6"/><text x="672" y="469" class="name">CanIf</text><text x="672" y="490" class="small">Match CAN identifier and payload length</text>
  </g>
  <path class="flow" d="M225 255v19 M225 338v19 M225 421v19"/>
  <path class="flow" d="M815 276v-19 M815 359v-19 M815 442v-19"/>
  <path class="flow" d="M387 473H651"/>
  <rect x="433" y="347" width="174" height="100" rx="8" fill="#26371f" stroke="#769858"/>
  <text x="520" y="372" text-anchor="middle" class="label">SIMULATED CAN</text>
  <text x="520" y="400" text-anchor="middle" font-size="21" font-weight="bold">0x123 · D2 04</text>
  <text x="520" y="426" text-anchor="middle" class="small">2-byte payload</text>
  <text x="40" y="573" class="small">COM encodes the signal. PduR chooses the route. CanIf maps the CAN frame.</text>
  <text x="40" y="597" class="small">The browser animation replays the completed C result; no CAN hardware is required.</text>
</svg>
